<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>TorresAI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

h1{
  margin:0;
  font-size:21px;
}

.logo{
  color:#e00000;
}

button{
  border:1px solid #444;
  background:#1b1b1b;
  color:white;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
}

button:hover{
  background:#292929;
}

.red{
  background:#d90000;
  border-color:#d90000;
}

#status{
  text-align:center;
  color:#aaa;
  font-size:12px;
  padding:8px;
}

#chat{
  height:calc(100vh - 170px);
  overflow-y:auto;
  padding:15px;
  max-width:900px;
  margin:auto;
}

.msg{
  padding:13px 15px;
  margin:9px 0;
  border-radius:17px;
  max-width:85%;
  white-space:pre-wrap;
  line-height:1.45;
}

.user{
  margin-left:auto;
  background:#8d0000;
}

.ai{
  background:#171717;
  border:1px solid #303030;
}

.web{
  color:#ff4b4b;
  font-size:12px;
  margin-bottom:5px;
}

#searchButton{
  display:block;
  margin:0 auto 8px auto;
}

#bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#101010;
  border-top:1px solid #333;
  padding:10px;
  display:flex;
  gap:7px;
}

textarea{
  flex:1;
  background:#191919;
  color:white;
  border:1px solid #444;
  border-radius:13px;
  padding:12px;
  resize:none;
  font-size:15px;
}

#settings{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  background:#111;
  border:1px solid #444;
  border-radius:18px;
  padding:20px;
  width:min(500px,100%);
}

input{
  width:100%;
  background:#191919;
  color:white;
  border:1px solid #444;
  padding:11px;
  border-radius:10px;
  margin:7px 0 15px;
}
</style>
</head>

<body>

<header>
  <h1><span class="logo">●</span> TorresAI</h1>
  <button onclick="openSettings()">⚙️</button>
</header>

<div id="status"></div>

<div id="chat"></div>

<button id="searchButton" onclick="toggleSearch()">
🌐 Buscar en Internet: OFF
</button>

<div id="bar">
  <button onclick="microfono()">🎙️</button>

  <textarea
    id="input"
    rows="1"
    placeholder="Habla con Torres..."
  ></textarea>

  <button class="red" onclick="send()">➤</button>
</div>

<div id="settings">
  <div class="card">

    <h2>Ajustes de Torres</h2>

    <label>Nombre de la IA</label>

    <input id="name">

    <label>Personalidad</label>

    <input id="personality">

    <br>

    <button onclick="clearMemory()">
      🗑️ Borrar memoria
    </button>

    <button class="red" onclick="saveSettings()">
      Guardar
    </button>

  </div>
</div>

<script>

let config = JSON.parse(
  localStorage.getItem("torres_config")
) || {
  name:"Torres",
  personality:
  "Eres Torres, un asistente amable, inteligente, paciente y respetuoso. Responde en español con claridad. No inventes información."
};

let history = JSON.parse(
  localStorage.getItem("torres_history")
) || [];

let webSearch = false;


/* INTERNET */

function updateStatus(){

  document.getElementById("status").textContent =
    navigator.onLine
    ? "🟢 Online"
    : "🔴 Offline";

}

window.addEventListener("online",updateStatus);
window.addEventListener("offline",updateStatus);

updateStatus();


/* CHAT */

function addMessage(text,type,web=false){

  const div=document.createElement("div");

  div.className="msg "+type;

  if(web){

    const tag=document.createElement("div");

    tag.className="web";

    tag.textContent="🌐 Búsqueda web";

    div.appendChild(tag);

  }

  const content=document.createElement("div");

  content.textContent=text;

  div.appendChild(content);

  document.getElementById("chat").appendChild(div);

  document.getElementById("chat").scrollTop=
    document.getElementById("chat").scrollHeight;
}


function showHistory(){

  document.getElementById("chat").innerHTML="";

  if(history.length===0){

    addMessage(
      "Hola, soy "+config.name+". ¿En qué puedo ayudarte?",
      "ai"
    );

    return;
  }

  history.forEach(x=>{

    addMessage(
      x.text,
      x.type,
      x.web
    );

  });

}

showHistory();


/* DETECTAR BÚSQUEDA */

function shouldSearch(text){

  const words=[
    "busca",
    "buscar",
    "internet",
    "web",
    "noticias",
    "actual",
    "actualmente",
    "último",
    "última",
    "últimos",
    "últimas",
    "reciente",
    "recientes",
    "hoy",
    "ayer",
    "quién ganó",
    "cuando es",
    "cuándo es",
    "precio",
    "tiempo",
    "clima"
  ];

  text=text.toLowerCase();

  return words.some(word=>text.includes(word));
}


/* CAMBIAR BÚSQUEDA */

function toggleSearch(){

  webSearch=!webSearch;

  document.getElementById("searchButton").textContent =
    "🌐 Buscar en Internet: "+
    (webSearch ? "ON":"OFF");

}


/* ENVIAR */

async function send(){

  const input=document.getElementById("input");

  const text=input.value.trim();

  if(!text)return;

  input.value="";

  const useWeb=
    webSearch ||
    shouldSearch(text);

  addMessage(text,"user");

  history.push({
    text:text,
    type:"user",
    web:false
  });

  const loading=document.createElement("div");

  loading.className="msg ai";

  loading.textContent="Pensando...";

  document.getElementById("chat").appendChild(loading);


  try{

    if(!navigator.onLine){

      throw new Error("offline");

    }


    const messages=[

      {
        role:"system",
        content:config.personality
      }

    ];


    if(history.length>1){

      messages.push({

        role:"system",

        content:
        "Conversación reciente:\n"+
        history
        .slice(-10)
        .map(x=>x.type+": "+x.text)
        .join("\n")

      });

    }


    if(useWeb){

      messages.push({

        role:"system",

        content:
        "Realiza una búsqueda web para responder. Usa información actual y verificable. Si la información puede cambiar con el tiempo, indica la fecha o contexto. No inventes fuentes."

      });

    }


    messages.push({

      role:"user",
      content:text

    });


    const response=await fetch(
      "https://text.pollinations.ai/",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          messages:messages,

          model:
            useWeb
            ? "gemini-search"
            : "openai"

        })

      }
    );


    if(!response.ok){

      throw new Error("Error del servidor");

    }


    const answer=
      await response.text();


    loading.innerHTML="";


    if(useWeb){

      const tag=
        document.createElement("div");

      tag.className="web";

      tag.textContent=
        "🌐 Búsqueda web";

      loading.appendChild(tag);

    }


    const content=
      document.createElement("div");

    content.textContent=answer;

    loading.appendChild(content);


    history.push({

      text:answer,

      type:"ai",

      web:useWeb

    });


    localStorage.setItem(
      "torres_history",
      JSON.stringify(history.slice(-50))
    );


    /* VOZ */

    if("speechSynthesis" in window){

      speechSynthesis.cancel();

      const voice=
        new SpeechSynthesisUtterance(answer);

      voice.lang="es-ES";

      speechSynthesis.speak(voice);

    }


  }catch(error){

    loading.textContent=
      "No puedo conectarme al servicio de IA ahora mismo. Comprueba tu conexión a Internet e inténtalo de nuevo.";

  }

}


/* ENTER */

document
.getElementById("input")
.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter" && !e.shiftKey){

      e.preventDefault();

      send();

    }

  }
);


/* MICRO */

function microfono(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "El reconocimiento de voz no está disponible en este navegador."
    );

    return;

  }

  const recognition=
    new SpeechRecognition();

  recognition.lang="es-ES";

  recognition.onresult=function(event){

    document.getElementById("input").value=
      event.results[0][0].transcript;

    send();

  };

  recognition.start();

}


/* AJUSTES */

function openSettings(){

  document.getElementById("name").value=
    config.name;

  document.getElementById("personality").value=
    config.personality;

  document.getElementById("settings").style.display=
    "flex";

}


function saveSettings(){

  config.name=
    document.getElementById("name").value ||
    "Torres";

  config.personality=
    document.getElementById("personality").value ||
    config.personality;

  localStorage.setItem(
    "torres_config",
    JSON.stringify(config)
  );

  document.getElementById("settings").style.display=
    "none";

}


function clearMemory(){

  history=[];

  localStorage.removeItem(
    "torres_history"
  );

  showHistory();

}


</script>

</body>
</html>
