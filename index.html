<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>TorresAI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080808;
 color:white;
}
header{
 background:linear-gradient(135deg,#8b0000,#e00000);
 padding:18px;
 text-align:center;
 box-shadow:0 3px 15px #000;
}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.85}

#status{
 text-align:center;
 padding:8px;
 background:#151515;
 font-size:13px;
}

main{
 max-width:900px;
 margin:auto;
 padding:15px;
}

#chat{
 min-height:55vh;
 max-height:65vh;
 overflow-y:auto;
 padding:10px;
}

.msg{
 padding:12px 15px;
 border-radius:15px;
 margin:10px 0;
 max-width:85%;
 white-space:pre-wrap;
 word-wrap:break-word;
}

.user{
 margin-left:auto;
 background:#b00000;
}

.bot{
 margin-right:auto;
 background:#202020;
 border:1px solid #3a3a3a;
}

.system{
 margin:auto;
 background:#151515;
 color:#aaa;
 font-size:13px;
}

.controls{
 display:flex;
 gap:8px;
 margin-top:10px;
}

textarea{
 flex:1;
 resize:none;
 min-height:55px;
 padding:13px;
 border-radius:12px;
 border:1px solid #444;
 background:#151515;
 color:white;
 font-size:16px;
}

button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 background:#d00000;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#f00000}

.secondary{
 background:#252525;
}

.panel{
 margin-top:15px;
 background:#121212;
 border:1px solid #333;
 border-radius:15px;
 padding:15px;
}

.panel h2{
 margin-top:0;
 color:#ff3030;
}

label{
 display:block;
 margin:10px 0;
}

input,select{
 width:100%;
 padding:10px;
 border-radius:8px;
 border:1px solid #444;
 background:#1b1b1b;
 color:white;
}

.hidden{display:none}

#imageResult img{
 max-width:100%;
 border-radius:12px;
 margin-top:10px;
}

.small{
 font-size:12px;
 color:#999;
}
</style>
</head>

<body>

<header>
<h1>🤖 TorresAI</h1>
<p>Tu asistente personal</p>
</header>

<div id="status">🟢 Comprobando conexión...</div>

<main>

<div id="chat"></div>

<div class="controls">
<textarea id="input" placeholder="Escribe a Torres..."></textarea>
<button onclick="sendMessage()">Enviar</button>
<button class="secondary" onclick="listen()">🎤</button>
</div>

<div class="controls">
<button class="secondary" onclick="toggleSettings()">⚙️ Configuración</button>
<button class="secondary" onclick="generateImage()">🎨 Imagen</button>
<button class="secondary" onclick="clearChat()">🗑️ Chat</button>
</div>

<div id="settings" class="panel hidden">

<h2>⚙️ Configuración</h2>

<label>
Nombre de la IA
<input id="aiName" value="Torres">
</label>

<label>
Personalidad
<input id="personality"
value="Amable, inteligente, cercana, respetuosa y útil. Actúa como un asistente personal.">
</label>

<label>
<input type="checkbox" id="voice">
 🔊 Responder con voz
</label>

<label>
<input type="checkbox" id="autoLearn" checked>
 🧠 Automejora controlada
</label>

<label>
<input type="checkbox" id="webSearch" checked>
 🌐 Buscar información en Internet cuando sea necesario
</label>

<label>
<input type="checkbox" id="offlineMode">
 📱 Forzar modo offline
</label>

<label>
Velocidad de voz
<input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1">
</label>

<button onclick="saveSettings()">Guardar configuración</button>
<button class="secondary" onclick="deleteMemory()">Borrar memoria</button>
<button class="secondary" onclick="deleteLearning()">Borrar aprendizaje</button>

<p class="small">
La memoria y el aprendizaje se guardan localmente en este navegador.
</p>

</div>

<div id="imagePanel" class="panel hidden">

<h2>🎨 Generador de imágenes</h2>

<input id="imagePrompt"
placeholder="Describe la imagen que quieres crear">

<br><br>

<button onclick="createImage()">Generar imagen</button>

<div id="imageResult"></div>

</div>

</main>

<script>

const STORAGE_CONFIG="torres_config";
const STORAGE_MEMORY="torres_memory";
const STORAGE_LEARN="torres_learning";

let config=JSON.parse(localStorage.getItem(STORAGE_CONFIG)||"null")||{
 name:"Torres",
 personality:"Amable, inteligente, cercana, respetuosa y útil. Actúa como un asistente personal.",
 voice:true,
 autoLearn:true,
 webSearch:true,
 offline:false,
 voiceRate:1
};

let memory=JSON.parse(localStorage.getItem(STORAGE_MEMORY)||"[]");
let learning=JSON.parse(localStorage.getItem(STORAGE_LEARN)||"[]");

const chat=document.getElementById("chat");
const input=document.getElementById("input");

function saveAll(){
 localStorage.setItem(STORAGE_CONFIG,JSON.stringify(config));
 localStorage.setItem(STORAGE_MEMORY,JSON.stringify(memory));
 localStorage.setItem(STORAGE_LEARN,JSON.stringify(learning));
}

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function welcome(){
 if(!chat.children.length){
  addMessage(
   "Hola 👋 Soy Torres. Estoy listo para ayudarte. Puedes hablar conmigo, usar el micrófono, guardar cosas en mi memoria, buscar información o generar imágenes.",
   "bot"
  );
 }
}

function updateStatus(){
 const online=navigator.onLine&&!config.offline;

 document.getElementById("status").textContent=
 online
 ? "🟢 Online"
 : "🔴 Offline";
}

window.addEventListener("online",updateStatus);
window.addEventListener("offline",updateStatus);

function toggleSettings(){
 document.getElementById("settings").classList.toggle("hidden");
 loadSettings();
}

function loadSettings(){
 document.getElementById("aiName").value=config.name;
 document.getElementById("personality").value=config.personality;
 document.getElementById("voice").checked=config.voice;
 document.getElementById("autoLearn").checked=config.autoLearn;
 document.getElementById("webSearch").checked=config.webSearch;
 document.getElementById("offlineMode").checked=config.offline;
 document.getElementById("voiceRate").value=config.voiceRate;
}

function saveSettings(){
 config.name=document.getElementById("aiName").value||"Torres";
 config.personality=document.getElementById("personality").value;
 config.voice=document.getElementById("voice").checked;
 config.autoLearn=document.getElementById("autoLearn").checked;
 config.webSearch=document.getElementById("webSearch").checked;
 config.offline=document.getElementById("offlineMode").checked;
 config.voiceRate=parseFloat(document.getElementById("voiceRate").value);

 if(!config.voice){
  speechSynthesis.cancel();
 }

 saveAll();
 updateStatus();

 addMessage("Configuración guardada.", "system");
}

function deleteMemory(){
 memory=[];
 saveAll();
 addMessage("Memoria borrada.", "system");
}

function deleteLearning(){
 learning=[];
 saveAll();
 addMessage("Aprendizaje borrado.", "system");
}

function clearChat(){
 chat.innerHTML="";
 welcome();
}

function speak(text){

 if(!config.voice) return;

 if(!("speechSynthesis" in window)) return;

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);
 u.lang="es-ES";
 u.rate=config.voiceRate;
 u.volume=1;

 speechSynthesis.speak(u);
}

function listen(){

 const SpeechRecognition=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  addMessage("El reconocimiento de voz no está disponible en este navegador.","system");
  return;
 }

 const recognition=new SpeechRecognition();

 recognition.lang="es-ES";
 recognition.interimResults=false;
 recognition.maxAlternatives=1;

 recognition.onstart=()=>{
  addMessage("🎤 Escuchando...", "system");
 };

 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
 };

 recognition.onerror=()=>{
  addMessage("No pude utilizar el micrófono.","system");
 };

 recognition.start();
}

function detectLearning(text){

 if(!config.autoLearn) return;

 const lower=text.toLowerCase();

 const patterns=[
  "recuerda que",
  "recuerda",
  "mi nombre es",
  "prefiero",
  "me gusta",
  "no me gusta",
  "quiero que"
 ];

 if(patterns.some(x=>lower.includes(x))){
  learning.push({
   text:text,
   date:new Date().toISOString()
  });

  if(learning.length>50)
   learning=learning.slice(-50);

  saveAll();
 }
}

function detectMemoryCommand(text){

 const lower=text.toLowerCase();

 if(lower.startsWith("recuerda que ")){
  const info=text.substring(13).trim();

  if(info){
   memory.push(info);

   if(memory.length>100)
    memory=memory.slice(-100);

   saveAll();

   return "He guardado eso en mi memoria local.";
  }
 }

 if(lower==="qué recuerdas"||lower==="que recuerdas"){
  if(!memory.length)
   return "No tengo recuerdos guardados todavía.";

  return "Esto es lo que recuerdo:\n\n• "+memory.join("\n• ");
 }

 return null;
}

function needsWeb(text){

 if(!config.webSearch) return false;
 if(!navigator.onLine||config.offline) return false;

 const words=[
  "hoy",
  "ahora",
  "actual",
  "actualmente",
  "últimas noticias",
  "noticias",
  "tiempo",
  "clima",
  "precio",
  "precios",
  "cotización",
  "qué pasó",
  "que paso",
  "quién es",
  "quien es",
  "último",
  "última",
  "últimos",
  "últimas",
  "2026"
 ];

 const lower=text.toLowerCase();

 return words.some(w=>lower.includes(w));
}

async function sendMessage(){

 const text=input.value.trim();

 if(!text)return;

 input.value="";

 addMessage(text,"user");

 detectLearning(text);

 const mem=detectMemoryCommand(text);

 if(mem){
  addMessage(mem,"bot");
  speak(mem);
  return;
 }

 const lower=text.toLowerCase();

 if(
  lower.includes("hola")||
  lower.includes("buenas")||
  lower==="hey"
 ){
  const answer="¡Hola! 👋 Soy "+config.name+". ¿En qué te ayudo?";
  addMessage(answer,"bot");
  speak(answer);
  return;
 }

 if(lower.includes("cómo te llamas")||lower.includes("como te llamas")){
  const answer="Me llamo "+config.name+".";
  addMessage(answer,"bot");
  speak(answer);
  return;
 }

 addMessage("⏳ Pensando...","system");

 try{

  const answer=await askAI(text);

  const systems=document.querySelectorAll(".system");
  if(systems.length)
   systems[systems.length-1].remove();

  addMessage(answer,"bot");
  speak(answer);

 }catch(error){

  const systems=document.querySelectorAll(".system");
  if(systems.length)
   systems[systems.length-1].remove();

  const answer=
   "Ahora mismo no puedo acceder al servicio de IA online. "+
   "Puedo seguir funcionando con mis funciones locales.";

  addMessage(answer,"bot");
  speak(answer);
 }
}

async function askAI(text){

 const online=navigator.onLine&&!config.offline;

 if(!online){
  return offlineAnswer(text);
 }

 /*
  TorresAI intenta usar un servicio externo gratuito.
  Estos servicios pueden cambiar sus condiciones o requerir
  autenticación en el futuro.
 */

 const mode=needsWeb(text)?"gemini-search":"openai";

 const system=
 `Eres ${config.name}, un asistente personal.
 Personalidad: ${config.personality}

 Memoria local:
 ${memory.join("\n")}

 Aprendizaje:
 ${learning.map(x=>x.text).join("\n")}

 Responde en español salvo que el usuario pida otro idioma.
 Sé claro, útil y respetuoso.
 No inventes información.
 ${needsWeb(text)
 ? "Si tienes acceso a búsqueda web, utiliza información actual."
 : ""}`;

 const url=
 "https://text.pollinations.ai/"+
 encodeURIComponent(
  system+"\n\nUsuario: "+text
 )+
 "?model="+encodeURIComponent(mode);

 const response=await fetch(url);

 if(!response.ok)
  throw new Error("Servicio no disponible");

 const result=await response.text();

 if(!result.trim())
  throw new Error("Respuesta vacía");

 return result.trim();
}

function offlineAnswer(text){

 const lower=text.toLowerCase();

 if(lower.includes("hora")){
  return "Puedo ayudarte con muchas tareas locales, pero para información actual como la hora exacta necesito consultar una fuente online.";
 }

 if(lower.includes("matemática")||
    lower.includes("matematicas")||
    lower.includes("cuánto es")||
    lower.includes("cuanto es")){

  try{
   const expression=text
    .replace(/[^0-9+\-*/().]/g,"");

   if(expression){
    const result=Function(
     '"use strict";return ('+expression+')'
    )();

    return "Resultado: "+result;
   }
  }catch(e){}
 }

 return "Estoy en modo offline. Puedo utilizar mi memoria local, configuración, voz y algunas funciones del dispositivo, pero una conversación de IA completa necesita un modelo local integrado.";
}

function generateImage(){

 document.getElementById("imagePanel")
  .classList.toggle("hidden");
}

function createImage(){

 const prompt=document.getElementById("imagePrompt").value.trim();

 if(!prompt)return;

 if(!navigator.onLine){
  document.getElementById("imageResult").innerHTML=
   "<p>Necesitas conexión a Internet para generar imágenes.</p>";
  return;
 }

 const url=
 "https://image.pollinations.ai/prompt/"+
 encodeURIComponent(prompt)+
 "?width=1024&height=1024&nologo=true";

 document.getElementById("imageResult").innerHTML=
  "<p>🎨 Generando...</p>"+
  "<img src='"+url+"' alt='Imagen generada'>";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

loadSettings();
updateStatus();
welcome();

</script>

</body>
</html>
