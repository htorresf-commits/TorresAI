<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="manifest.json">
<title>TorresAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font:16px system-ui;min-height:100vh}
header{height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#101010;border-bottom:1px solid #292929}
h1{font-size:20px;margin:0}.dot{color:#e31b23}
button{background:#191919;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.red{background:#d71920;border:0}
main{max-width:900px;margin:auto;height:calc(100vh - 62px);display:flex;flex-direction:column}
#status{text-align:center;color:#aaa;font-size:12px;padding:8px}
#chat{flex:1;overflow:auto;padding:10px 14px}
.m{padding:12px 14px;margin:8px 0;border-radius:17px;max-width:88%;white-space:pre-wrap;line-height:1.45}
.u{margin-left:auto;background:#8e1118}.a{background:#151515;border:1px solid #292929}
.webmark{display:inline-block;font-size:11px;color:#ff6b70;margin-bottom:4px}
.bar{display:flex;gap:7px;padding:10px;background:#0d0d0d;border-top:1px solid #292929}
textarea{flex:1;background:#181818;color:#fff;border:1px solid #333;border-radius:14px;padding:12px;font:inherit;resize:none}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px}
.card{background:#111;border:1px solid #333;border-radius:18px;padding:18px;width:min(560px,100%)}
input,.card textarea{width:100%;background:#181818;color:#fff;border:1px solid #333;border-radius:10px;padding:10px;margin:6px 0 14px}
.row{display:flex;gap:8px;justify-content:flex-end}.small{font-size:12px;color:#aaa}
.tools{display:flex;gap:6px;padding:8px 10px 0;background:#0d0d0d}
.tool{font-size:12px;padding:7px 10px}
.active{outline:2px solid #d71920}
</style>
</head>
<body>
<header><h1><span class="dot">●</span> TorresAI</h1><button id="set">⚙️</button></header>
<main>
<div id="status"></div>
<div id="chat"></div>
<div class="tools">
  <button class="tool" id="web">🌐 Buscar en Internet: OFF</button>
</div>
<div class="bar">
  <button id="mic">🎙️</button>
  <textarea id="in" rows="1" placeholder="Habla con Torres…"></textarea>
  <button class="red" id="go">➤</button>
</div>
</main>

<div class="modal" id="modal"><div class="card">
<h2>Ajustes de Torres</h2><p style="font-size:13px;opacity:.8">🎨 La generación de imágenes funciona cuando hay Internet y depende de un servicio externo.</p>
<label>Nombre</label><input id="nm">
<label>Personalidad</label><textarea id="per" rows="4"></textarea>
<label><input type="checkbox" id="mem"> Guardar memoria local</label>
<p class="small">La memoria se guarda en este navegador. No se envía como una lista separada.</p>
<div class="row"><button id="clr">Borrar memoria</button><button id="save" class="red">Guardar</button></div>
</div></div>

<script>
const $=x=>document.querySelector(x);
let cfg=JSON.parse(localStorage.getItem('torres_cfg')||'null')||{
  name:'Torres',
  per:'Eres Torres, un asistente amable, inteligente, paciente y respetuoso. Responde en español con claridad, distingue hechos de opiniones y no inventes datos.',
  mem:true
};
let h=JSON.parse(localStorage.getItem('torres_hist')||'[]');
let forceWeb=false;

function store(){
  localStorage.setItem('torres_cfg',JSON.stringify(cfg));
  localStorage.setItem('torres_hist',JSON.stringify(h.slice(-40)));
}
function add(user,t,web=false){
  let d=document.createElement('div');
  d.className='m '+(user?'u':'a');
  if(web&&!user){
    let mark=document.createElement('div');
    mark.className='webmark';
    mark.textContent='🌐 Respuesta con búsqueda web';
    d.append(mark);
  }
  let txt=document.createElement('div');
  txt.textContent=t;
  d.append(txt);
  $('#chat').append(d);
  $('#chat').scrollTop=1e9;
}
function render(){
  $('#chat').innerHTML='';
  if(h.length) h.forEach(x=>add(x.role==='user',x.content,x.web));
  else add(false,`Hola, soy ${cfg.name}. Estoy listo para ayudarte.`);
}
function local(){
  return 'Estoy en modo offline. Puedo seguir conversando contigo, pero para respuestas de IA y búsquedas web necesito conexión a Internet.';
}
function looksLikeSearch(t){
  return /^(busca|buscar|búscame|mira|consulta|investiga|qué ha pasado|que ha pasado|últimas|ultimas|noticias|hoy|actualmente|precio actual|tiempo|clima|quién ganó|quien gano|cuándo es|cuando es|dónde está|donde esta|qué es lo último|que es lo ultimo)\b/i.test(t.trim())
    || /\b(en internet|en la web|web|internet|noticias|último|última|actual|actuales|reciente|recientes)\b/i.test(t);
}
async function ask(t, useWeb){
  let msgs=[{role:'system',content:cfg.per}];
  if(cfg.mem && h.length){
    msgs.push({role:'system',content:'Contexto de conversación reciente:\\n'+h.slice(-10).map(x=>x.role+': '+x.content).join('\\n')});
  }
  if(useWeb){
    msgs.push({role:'system',content:'Necesitas responder usando búsqueda web actual. Busca información reciente y verificable. Si das datos que puedan cambiar, indica la fecha o el contexto temporal. No inventes fuentes ni resultados. Si no puedes realizar la búsqueda, dilo claramente.'});
  }
  msgs.push({role:'user',content:t});
  const model=useWeb?'gemini-search':'openai';
  let r=await fetch('https://text.pollinations.ai/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:msgs,model:model})
  });
  if(!r.ok) throw Error('API '+r.status);
  return (await r.text()).trim();
}

function toggleImagePanel(){
  const p = document.getElementById("imagePanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
}

function createImage(){
  const input = document.getElementById("imagePrompt");
  const status = document.getElementById("imageStatus");
  const prompt = input.value.trim();
  if(!prompt){
    status.textContent = "Escribe una descripción primero.";
    return;
  }
  if(!navigator.onLine){
    status.textContent = "🔴 La creación de imágenes necesita conexión a Internet.";
    return;
  }

  status.textContent = "Generando imagen…";
  const encoded = encodeURIComponent(prompt);
  const url = "https://image.pollinations.ai/prompt/" + encoded + "?width=1024&height=1024&nologo=true";

  const chat = document.getElementById("chat");
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  const title = document.createElement("div");
  title.className = "web";
  title.textContent = "🎨 Imagen generada";
  wrap.appendChild(title);

  const img = document.createElement("img");
  img.src = url;
  img.alt = prompt;
  img.style.maxWidth = "100%";
  img.style.borderRadius = "14px";
  img.style.marginTop = "8px";
  img.loading = "lazy";

  img.onload = () => {
    status.textContent = "✅ Imagen lista.";
    wrap.appendChild(document.createElement("br"));
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  };

  img.onerror = () => {
    status.textContent = "No se pudo generar la imagen. El servicio puede requerir cambios o no estar disponible.";
    wrap.remove();
  };

  wrap.appendChild(img);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

async function send(){
  let t=$('#in').value.trim(); if(!t)return;
  $('#in').value='';
  const useWeb=forceWeb || looksLikeSearch(t);
  h.push({role:'user',content:t,web:false});
  add(true,t);
  let d=document.createElement('div');
  d.className='m a'; d.textContent='…'; $('#chat').append(d);
  try{
    if(!navigator.onLine) throw Error('offline');
    d.textContent=await ask(t,useWeb);
    if(useWeb){
      let mark=document.createElement('div');
      mark.className='webmark';
      mark.textContent='🌐 Respuesta con búsqueda web';
      d.prepend(mark);
    }
  }catch(e){
    d.textContent=local();
  }
  h.push({role:'assistant',content:d.textContent.replace('🌐 Respuesta con búsqueda web','').trim(),web:useWeb});
  store();
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(d.textContent);
    u.lang='es-ES'; speechSynthesis.speak(u);
  }
}
function net(){
  $('#status').textContent=navigator.onLine?'🟢 Online':'🔴 Offline';
}
addEventListener('online',net); addEventListener('offline',net); net(); render();

$('#go').onclick=send;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#mic').onclick=()=>{
  let S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S)return alert('El reconocimiento de voz no está disponible en este navegador.');
  let r=new S; r.lang='es-ES';
  r.onresult=e=>{$('#in').value=e.results[0][0].transcript;send()};
  r.start();
};
$('#web').onclick=()=>{
  forceWeb=!forceWeb;
  $('#web').textContent='🌐 Buscar en Internet: '+(forceWeb?'ON':'OFF');
  $('#web').classList.toggle('active',forceWeb);
};
$('#set').onclick=()=>{
  $('#nm').value=cfg.name; $('#per').value=cfg.per; $('#mem').checked=cfg.mem;
  $('#modal').style.display='flex';
};
$('#save').onclick=()=>{
  cfg.name=$('#nm').value||'Torres';
  cfg.per=$('#per').value||cfg.per;
  cfg.mem=$('#mem').checked;
  store(); $('#modal').style.display='none'; render();
};
$('#clr').onclick=()=>{h=[];store();render()};
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
<script>
if("speechSynthesis" in window){
  populateVoiceList();
  if("onvoiceschanged" in speechSynthesis){
    speechSynthesis.onvoiceschanged = populateVoiceList;
  }
}
</script>
